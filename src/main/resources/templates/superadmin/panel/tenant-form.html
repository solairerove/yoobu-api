<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formMode == 'edit' ? 'Edit Tenant | Superadmin' : 'Create Tenant | Superadmin'}">Tenant form | Superadmin</title>
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
</head>
<body>
<div class="shell shell-narrow">
    <header class="page-header">
        <div>
            <p class="eyebrow">Superadmin panel</p>
            <h1 th:text="${formMode == 'edit' ? 'Edit tenant' : 'Create tenant'}">Tenant form</h1>
        </div>
        <nav class="nav">
            <a class="nav-link" th:href="@{/superadmin/panel/tenants}">Tenants</a>
            <a class="nav-link"
               th:classappend="${formMode == 'create'} ? ' active'"
               th:href="@{/superadmin/panel/tenants/new}">Create tenant</a>
            <a class="nav-link"
               th:if="${formMode == 'edit'}"
               th:classappend="${formMode == 'edit'} ? ' active'"
               th:href="@{/superadmin/panel/tenants/{tenantId}/edit(tenantId=${tenantId})}">Edit</a>
        </nav>
    </header>

    <section class="card">
        <form method="post"
              th:action="${formMode == 'edit'} ? @{/superadmin/panel/tenants/{tenantId}(tenantId=${tenantId})} : @{/superadmin/panel/tenants}"
              th:object="${tenantForm}">
            <p class="error" th:if="${formError}" th:text="${formError}">Tenant error</p>

            <div class="field-row">
                <label>
                    <span>Slug</span>
                    <input type="text"
                           th:field="*{slug}"
                           th:readonly="${formMode == 'edit'}"
                           th:attr="data-slug-check-url=${formMode == 'create'} ? @{/superadmin/tenants/slug-availability} : null">
                </label>
                <label>
                    <span>Name</span>
                    <input type="text" th:field="*{name}">
                </label>
            </div>
            <p class="error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}">Slug error</p>
            <p class="error" id="slug-availability-message" th:if="${formMode == 'create'}" hidden></p>
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>

            <div class="field-row">
                <label>
                    <span>Tenant type</span>
                    <select th:field="*{type}">
                        <option th:each="tenantType : ${tenantTypes}"
                                th:value="${tenantType}"
                                th:text="${tenantType}"></option>
                    </select>
                </label>
                <label>
                    <span>Timezone</span>
                    <input type="text" th:field="*{timezone}">
                </label>
            </div>

            <div class="field-row">
                <label>
                    <span>Admin username</span>
                    <input type="text" th:field="*{adminUsername}">
                </label>
                <label>
                    <span th:text="${formMode == 'edit' ? 'Admin password (leave blank to keep)' : 'Admin password'}">Admin password</span>
                    <input type="text" th:field="*{adminPassword}">
                </label>
            </div>
            <p class="error" th:if="${#fields.hasErrors('adminUsername')}" th:errors="*{adminUsername}">Admin user error</p>
            <p class="error" th:if="${formMode == 'create' and #fields.hasErrors('adminPassword')}" th:errors="*{adminPassword}">Admin password error</p>

            <div class="field-row">
                <label>
                    <span>Bot token</span>
                    <input type="text" th:field="*{botToken}">
                </label>
                <label>
                    <span>Owner Telegram ID</span>
                    <input type="number" th:field="*{ownerTelegramId}">
                </label>
            </div>

            <div class="field-row">
                <label>
                    <span>Primary color</span>
                    <input type="text" th:field="*{primaryColor}" placeholder="#112233">
                </label>
                <label>
                    <span>Logo URL</span>
                    <input type="text" th:field="*{logoUrl}">
                </label>
            </div>

            <label>
                <span>Welcome message</span>
                <textarea rows="4" th:field="*{welcomeMessage}"></textarea>
            </label>

            <label th:if="${formMode == 'edit'}">
                <span>Active</span>
                <input type="checkbox" th:field="*{active}">
            </label>

            <div class="actions">
                <a class="secondary-link"
                   th:href="${formMode == 'edit'} ? @{/superadmin/panel/tenants/{tenantId}(tenantId=${tenantId})} : @{/superadmin/panel/tenants}">Cancel</a>
                <button type="submit" th:text="${formMode == 'edit' ? 'Save changes' : 'Create tenant'}">Submit</button>
            </div>
        </form>
    </section>
</div>
<script th:if="${formMode == 'create'}">
    (() => {
        const form = document.querySelector('form');
        const slugInput = document.querySelector('input[name="slug"]');
        const submitButton = form?.querySelector('button[type="submit"]');
        const message = document.getElementById('slug-availability-message');
        const checkUrl = slugInput?.dataset.slugCheckUrl;

        if (!form || !slugInput || !submitButton || !message || !checkUrl) {
            return;
        }

        let requestCounter = 0;
        let debounceTimer;
        let slugAvailable = false;
        let isChecking = false;

        const updateState = () => {
            submitButton.disabled = isChecking || !slugAvailable;
        };

        const hideMessage = () => {
            message.hidden = true;
            message.textContent = '';
        };

        const showMessage = (text) => {
            message.hidden = false;
            message.textContent = text;
        };

        const resetState = () => {
            isChecking = false;
            slugAvailable = false;
            hideMessage();
            updateState();
        };

        const checkSlug = async () => {
            const slug = slugInput.value.trim();
            if (!slug) {
                resetState();
                return;
            }

            const requestId = ++requestCounter;
            isChecking = true;
            slugAvailable = false;
            showMessage('Checking tenant slug...');
            updateState();

            try {
                const response = await fetch(`${checkUrl}?slug=${encodeURIComponent(slug)}`, {
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                if (!response.ok) {
                    throw new Error('Slug check failed');
                }

                const result = await response.json();
                if (requestId != requestCounter) {
                    return;
                }

                isChecking = false;
                slugAvailable = Boolean(result.available);

                if (slugAvailable) {
                    showMessage('Tenant slug is available.');
                } else {
                    showMessage('Tenant slug already exists.');
                }
                updateState();
            } catch (error) {
                if (requestId != requestCounter) {
                    return;
                }

                isChecking = false;
                slugAvailable = false;
                showMessage('Unable to verify tenant slug right now.');
                updateState();
            }
        };

        slugInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = window.setTimeout(checkSlug, 300);
        });

        slugInput.addEventListener('blur', () => {
            clearTimeout(debounceTimer);
            void checkSlug();
        });

        form.addEventListener('submit', (event) => {
            if (isChecking || !slugAvailable) {
                event.preventDefault();
            }
        });

        resetState();
    })();
</script>
</body>
</html>
