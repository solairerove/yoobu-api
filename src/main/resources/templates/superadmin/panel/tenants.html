<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenants | Superadmin</title>
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
</head>
<body>
<div class="shell">
    <header class="page-header">
        <div>
            <p class="eyebrow">Superadmin panel</p>
            <h1>Tenants</h1>
        </div>
        <nav class="nav">
            <a class="nav-link active" th:href="@{/superadmin/panel/tenants}">Tenants</a>
            <a class="nav-link" th:href="@{/superadmin/panel/tenants/new}">Create tenant</a>
            <a class="nav-link" th:href="@{/superadmin/panel/audit}">Audit log</a>
        </nav>
    </header>

    <section class="card" th:if="${flashMessage}">
        <p class="flash"
           th:classappend="${flashType == 'success'} ? ' flash-success' : ' flash-error'"
           th:text="${flashMessage}">
            Tenant updated.
        </p>
    </section>

    <section class="toolbar">
        <a class="button-link" th:href="@{/superadmin/panel/tenants/new}">New tenant</a>
    </section>

    <section class="card">
        <form class="filters" method="get" th:action="@{/superadmin/panel/tenants}">
            <label>
                <span>Search by name or slug</span>
                <input type="text" name="query" th:value="${query}" placeholder="dark-kitchen">
            </label>
            <input type="hidden" name="size" th:value="${size}">
            <input type="hidden" name="page" value="0">
            <button type="submit" class="button-secondary">Search</button>
        </form>
    </section>

    <section class="card">
        <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Slug</th>
                <th>Type</th>
                <th>Status</th>
                <th>Timezone</th>
                <th>Created</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(tenants)}">
                <td colspan="7" class="empty">No tenants yet.</td>
            </tr>
            <tr th:each="tenant : ${tenants}">
                <td>
                    <a th:href="@{/superadmin/panel/tenants/{tenantId}(tenantId=${tenant.id})}"
                       th:text="${tenant.name}">Dark Kitchen</a>
                </td>
                <td th:text="${tenant.slug}">dark-kitchen</td>
                <td th:text="${tenant.type}">FOOD_ORDER</td>
                <td>
                    <span class="badge"
                          th:classappend="${tenant.active} ? ' badge-success' : ' badge-muted'"
                          th:text="${tenant.active} ? 'Active' : 'Inactive'">Active</span>
                </td>
                <td th:text="${tenant.timezone}">Asia/Ho_Chi_Minh</td>
                <td th:text="${tenant.createdAt != null ? #temporals.format(tenant.createdAt, 'yyyy-MM-dd HH:mm') : 'N/A'}">2026-03-14 00:00</td>
                <td>
                    <a th:href="@{/admin/{slug}/panel(slug=${tenant.slug})}">Open admin panel</a>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
        <div class="pager" th:if="${tenantPage.totalPages > 1}">
            <a class="nav-link"
               th:if="${tenantPage.hasPrevious()}"
               th:href="@{/superadmin/panel/tenants(query=${query}, page=${tenantPage.number - 1}, size=${size})}">
                Previous
            </a>
            <span class="pager-info"
                  th:text="${'Page ' + (tenantPage.number + 1) + ' of ' + tenantPage.totalPages}">Page 1 of 1</span>
            <a class="nav-link"
               th:if="${tenantPage.hasNext()}"
               th:href="@{/superadmin/panel/tenants(query=${query}, page=${tenantPage.number + 1}, size=${size})}">
                Next
            </a>
        </div>
    </section>
</div>
</body>
</html>
