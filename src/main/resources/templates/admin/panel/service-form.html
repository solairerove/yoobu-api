<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle} + ' | ' + ${slug}">Service form</title>
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
</head>
<body>
<div class="shell shell-narrow">
    <header class="page-header">
        <div>
            <p class="eyebrow">Admin panel</p>
            <h1 th:text="${formTitle}">Service form</h1>
        </div>
        <nav class="nav">
            <a class="nav-link" th:href="@{/admin/{slug}/panel/bookings(slug=${slug})}">Bookings</a>
            <a class="nav-link active" th:href="@{/admin/{slug}/panel/services(slug=${slug})}">Services</a>
        </nav>
    </header>

    <section class="card">
        <p class="flash"
           th:if="${flashMessage}"
           th:classappend="${flashType == 'success'} ? ' flash-success' : ' flash-error'"
           th:text="${flashMessage}">
            Status updated.
        </p>

        <form method="post" th:action="${formAction}" th:object="${serviceForm}"
              enctype="multipart/form-data">
            <label>
                <span>Name</span>
                <input type="text" th:field="*{name}">
            </label>
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>

            <label>
                <span>Description</span>
                <textarea rows="4" th:field="*{description}"></textarea>
            </label>

            <div th:if="${editServiceId != null}">
                <div th:if="${currentImageUrl}" style="margin-bottom: 0.75rem;">
                    <p class="field-hint" style="margin-bottom: 0.5rem;">Current image:</p>
                    <img th:src="${currentImageUrl}" alt="Service image"
                         style="max-width: 200px; max-height: 150px; display: block; object-fit: cover;
                                border: 1px solid var(--border); border-radius: 6px;">
                </div>
                <div th:if="${currentImageUrl == null}" style="margin-bottom: 0.75rem;">
                    <p class="field-hint">No image uploaded yet.</p>
                </div>
                <label>
                    <span th:text="${currentImageUrl != null} ? 'Replace image (JPEG, PNG, WebP · max 2 MB)' : 'Upload image (JPEG, PNG, WebP · max 2 MB)'">Upload image</span>
                    <input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp">
                </label>
            </div>

            <div class="field-row">
                <label>
                    <span>Price</span>
                    <input type="number" step="0.01" min="0" th:field="*{price}">
                </label>
                <label>
                    <span>Unit</span>
                    <input type="text" th:field="*{unit}">
                </label>
            </div>
            <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price error</p>

            <div class="field-row">
                <label>
                    <span>Duration minutes</span>
                    <input type="number" min="0" th:field="*{durationMinutes}">
                </label>
                <label>
                    <span>Sort order</span>
                    <input type="number" th:field="*{sortOrder}">
                </label>
            </div>

            <label>
                <span>Status</span>
                <select th:field="*{status}">
                    <option th:each="status : ${serviceStatuses}"
                            th:value="${status}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(status.name()))}">
                        Active
                    </option>
                </select>
            </label>

            <div class="actions">
                <a class="secondary-link" th:href="@{/admin/{slug}/panel/services(slug=${slug})}">Cancel</a>
                <button type="submit" th:text="${submitLabel}">Save</button>
            </div>
        </form>
        <form method="post"
              th:if="${editServiceId != null}"
              th:action="@{/admin/{slug}/panel/services/{serviceId}/delete(slug=${slug}, serviceId=${editServiceId})}">
            <p class="field-hint">
                Type <strong th:text="${serviceForm.name}">Service Name</strong> to confirm deletion.
            </p>
            <label>
                <span>Confirm service name</span>
                <input type="text" name="confirmName" autocomplete="off" required>
            </label>
            <div class="actions actions-danger">
                <button type="submit" class="button-danger">Delete service</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
