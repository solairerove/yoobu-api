<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Bookings | ' + ${slug}">Bookings</title>
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
</head>
<body>
<div class="shell">
    <header class="page-header">
        <div>
            <p class="eyebrow">Admin panel</p>
            <h1 th:text="'Bookings for ' + ${slug}">Bookings</h1>
        </div>
        <nav class="nav">
            <a class="nav-link active" th:href="@{/admin/{slug}/panel/bookings(slug=${slug})}">Bookings</a>
            <a class="nav-link" th:href="@{/admin/{slug}/panel/services(slug=${slug})}">Services</a>
        </nav>
    </header>

    <section class="card" th:if="${flashMessage}">
        <p class="flash"
           th:classappend="${flashType == 'success'} ? ' flash-success' : ' flash-error'"
           th:text="${flashMessage}">
            Status updated.
        </p>
    </section>

    <section class="card">
        <form class="filters" method="get" th:action="@{/admin/{slug}/panel/bookings(slug=${slug})}">
            <label>
                <span>Status</span>
                <select name="status">
                    <option value="">All</option>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption}"
                            th:text="${statusOption}"
                            th:selected="${statusOption == selectedStatus}"></option>
                </select>
            </label>
            <label>
                <span>Delivery date</span>
                <input type="date" name="deliveryDate" th:value="${deliveryDate}">
            </label>
            <input type="hidden" name="size" th:value="${size}">
            <input type="hidden" name="page" value="0">
            <button type="submit" class="button-secondary">Filter</button>
        </form>
    </section>

    <section class="card">
        <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Delivery</th>
                <th>Total</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="6" class="empty">No bookings found.</td>
            </tr>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.id}">1</td>
                <td th:text="${booking.customerName}">Alice</td>
                  <td>
                    <form class="inline-status-form"
                          method="post"
                          th:action="@{/admin/{slug}/panel/bookings/{bookingId}/status(slug=${slug}, bookingId=${booking.id})}">
                        <label class="sr-only" th:for="${'booking-status-' + booking.id}">
                            <span th:text="${'Status for booking ' + booking.id}">Status for booking</span>
                        </label>
                        <select name="status" th:id="${'booking-status-' + booking.id}">
                            <option th:each="statusOption : ${statusOptionsByBookingId[booking.id]}"
                                    th:value="${statusOption}"
                                    th:text="${statusOption}"
                                    th:selected="${statusOption == booking.status}"></option>
                        </select>
                        <input type="hidden" name="returnTo" value="list">
                        <button type="submit" class="button-secondary button-compact">Update</button>
                    </form>
                  </td>
                <td th:text="${booking.deliveryDate}">2026-03-14</td>
                <td th:text="${@adminPanelViewFormats.money(booking.totalPrice, booking.currency)}">USD 12.50</td>
                  <td>
                    <a class="table-link" th:href="@{/admin/{slug}/panel/bookings/{bookingId}(slug=${slug}, bookingId=${booking.id})}">
                        View
                    </a>
                  </td>
            </tr>
            </tbody>
        </table>
        </div>
        <div class="pager" th:if="${bookingPage.totalPages > 1}">
            <a class="nav-link"
               th:if="${bookingPage.hasPrevious()}"
               th:href="@{/admin/{slug}/panel/bookings(slug=${slug}, status=${selectedStatus}, deliveryDate=${deliveryDate}, page=${bookingPage.number - 1}, size=${size})}">
                Previous
            </a>
            <span class="pager-info"
                  th:text="${'Page ' + (bookingPage.number + 1) + ' of ' + bookingPage.totalPages}">Page 1 of 1</span>
            <a class="nav-link"
               th:if="${bookingPage.hasNext()}"
               th:href="@{/admin/{slug}/panel/bookings(slug=${slug}, status=${selectedStatus}, deliveryDate=${deliveryDate}, page=${bookingPage.number + 1}, size=${size})}">
                Next
            </a>
        </div>
    </section>
</div>
</body>
</html>
