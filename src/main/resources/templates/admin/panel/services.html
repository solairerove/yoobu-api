<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Services | ' + ${slug}">Services</title>
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
</head>
<body>
<div class="shell">
    <header class="page-header">
        <div>
            <p class="eyebrow">Admin panel</p>
            <h1 th:text="'Services for ' + ${slug}">Services</h1>
        </div>
        <nav class="nav">
            <a class="nav-link" th:href="@{/admin/{slug}/panel/bookings(slug=${slug})}">Bookings</a>
            <a class="nav-link active" th:href="@{/admin/{slug}/panel/services(slug=${slug})}">Services</a>
        </nav>
    </header>

    <div class="flash-banner"
         th:if="${flashMessage}"
         th:classappend="${flashType == 'success'} ? ' flash-success' : ' flash-error'">
        <p th:text="${flashMessage}">Service updated.</p>
    </div>

    <section class="toolbar">
        <a class="button-link" th:href="@{/admin/{slug}/panel/services/new(slug=${slug})}">New service</a>
    </section>

    <section class="card">
        <form class="filters" method="get" th:action="@{/admin/{slug}/panel/services(slug=${slug})}">
            <label>
                <span>Search by name</span>
                <input type="text" name="query" th:value="${query}" placeholder="Pizza, Pasta...">
            </label>
            <input type="hidden" name="size" th:value="${size}">
            <input type="hidden" name="page" value="0">
            <button type="submit" class="button-secondary">Search</button>
        </form>
    </section>

    <section class="card">
        <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Unit</th>
                <th>Duration</th>
                <th>Sort order</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(services)}">
                <td colspan="7" class="empty">No services yet.</td>
            </tr>
            <tr th:each="service : ${services}">
                <td th:text="${service.name}">Pizza</td>
                <td th:text="${@adminPanelViewFormats.money(service.price, currency)}">USD 12.50</td>
                <td th:text="${service.unit}">pcs</td>
                <td th:text="${service.durationMinutes ?: 'N/A'}">N/A</td>
                <td th:text="${service.sortOrder}">0</td>
                  <td>
                    <form class="inline-status-form"
                          method="post"
                          th:action="@{/admin/{slug}/panel/services/{serviceId}/status(slug=${slug}, serviceId=${service.id})}">
                        <label class="sr-only" th:for="${'service-status-' + service.id}">
                            <span th:text="${'Status for service ' + service.name}">Status for service</span>
                        </label>
                        <select name="status"
                                th:id="${'service-status-' + service.id}"
                                th:classappend="${service.status.name() == 'ACTIVE'} ? ' status-select-active' : ' status-select-inactive'">
                            <option th:each="statusOption : ${serviceStatuses}"
                                    th:value="${statusOption}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(statusOption.name()))}"
                                    th:selected="${statusOption == service.status}">
                                Active
                            </option>
                        </select>
                        <button type="submit" class="button-secondary button-compact">Update</button>
                    </form>
                  </td>
                  <td>
                    <a class="table-link" th:href="@{/admin/{slug}/panel/services/{serviceId}/edit(slug=${slug}, serviceId=${service.id})}">
                        Edit
                    </a>
                  </td>
            </tr>
            </tbody>
        </table>
        </div>
        <div class="pager" th:if="${servicePage.totalPages > 1}">
            <a class="nav-link"
               th:if="${servicePage.hasPrevious()}"
               th:href="@{/admin/{slug}/panel/services(slug=${slug}, query=${query}, page=${servicePage.number - 1}, size=${size})}">
                Previous
            </a>
            <span class="pager-info"
                  th:text="${'Page ' + (servicePage.number + 1) + ' of ' + servicePage.totalPages}">Page 1 of 1</span>
            <a class="nav-link"
               th:if="${servicePage.hasNext()}"
               th:href="@{/admin/{slug}/panel/services(slug=${slug}, query=${query}, page=${servicePage.number + 1}, size=${size})}">
                Next
            </a>
        </div>
    </section>
</div>
</body>
</html>
