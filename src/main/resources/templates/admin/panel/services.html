<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Services | ' + ${slug}">Services</title>
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
</head>
<body>
<div class="shell">
    <header class="page-header">
        <div>
            <p class="eyebrow">Admin panel</p>
            <h1 th:text="'Services for ' + ${slug}">Services</h1>
        </div>
        <nav class="nav">
            <a class="nav-link" th:href="@{/admin/{slug}/panel/bookings(slug=${slug})}">Bookings</a>
            <a class="nav-link active" th:href="@{/admin/{slug}/panel/services(slug=${slug})}">Services</a>
        </nav>
    </header>

    <section class="toolbar">
        <a class="button-link" th:href="@{/admin/{slug}/panel/services/new(slug=${slug})}">New service</a>
    </section>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Unit</th>
                <th>Duration</th>
                <th>Sort order</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(services)}">
                <td colspan="7" class="empty">No services yet.</td>
            </tr>
            <tr th:each="service : ${services}">
                <td th:text="${service.name}">Pizza</td>
                <td th:text="${service.price}">12.50</td>
                <td th:text="${service.unit}">pcs</td>
                <td th:text="${service.durationMinutes ?: 'N/A'}">N/A</td>
                <td th:text="${service.sortOrder}">0</td>
                <td>
                    <form class="inline-status-form"
                          method="post"
                          th:action="@{/admin/{slug}/panel/services/{serviceId}/status(slug=${slug}, serviceId=${service.id})}">
                        <label class="sr-only" th:for="${'service-status-' + service.id}">
                            <span th:text="${'Status for service ' + service.name}">Status for service</span>
                        </label>
                        <select name="status"
                                th:id="${'service-status-' + service.id}"
                                th:classappend="${service.status.name() == 'ACTIVE'} ? ' status-select-active' : ' status-select-inactive'">
                            <option th:each="statusOption : ${serviceStatuses}"
                                    th:value="${statusOption}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(statusOption.name()))}"
                                    th:selected="${statusOption == service.status}">
                                Active
                            </option>
                        </select>
                        <button type="submit">Update</button>
                    </form>
                </td>
                <td>
                    <a th:href="@{/admin/{slug}/panel/services/{serviceId}/edit(slug=${slug}, serviceId=${service.id})}">
                        Edit
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
