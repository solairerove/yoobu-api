services:
  postgres:
    image: postgres:18.3
    container_name: yoobu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoobu
      POSTGRES_USER: yoobu
      POSTGRES_PASSWORD: yoobu
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - yoobu-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoobu -d yoobu"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yoobu-net

  app:
    profiles: [full]
    build: .
    container_name: yoobu-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/yoobu
      DB_USER: yoobu
      DB_PASS: yoobu
      SUPERADMIN_USER: superadmin
      SUPERADMIN_PASS: superadmin
      SPRING_PROFILES_ACTIVE: dev
      IMAGE_SERVICE_URL: http://yoobu-media:3000
      CDN_BASE_URL: http://localhost:9000/yoobu-media
    volumes:
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yoobu-net

volumes:
  yoobu-postgres-data:
  maven-cache:

networks:
  yoobu-net:
    external: true
