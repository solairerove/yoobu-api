services:
  postgres:
    image: postgres:18.3
    container_name: yoobu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoobu
      POSTGRES_USER: yoobu
      POSTGRES_PASSWORD: yoobu
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - yoobu-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoobu -d yoobu"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: yoobu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - yoobu-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: yoobu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/yoobu-media;
        mc anonymous set public local/yoobu-media;
        exit 0;
      "

volumes:
  yoobu-postgres-data:
  yoobu-minio-data:
